[package]
name = "demo-web"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
base64 = "0.23.1"
biscuit-auth = "6"
hex = "0.4.3"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "json", "form"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["full"] }
uuid = { version = "1.27.0", features = ["v4"] }
